name: Publish to GHCR and MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      IMAGE: ghcr.io/datlabhq/datlab-mcp
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Set version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version package.json)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          jq --arg v "$VERSION" --arg id "ghcr.io/datlabhq/datlab-mcp:${VERSION}" \
            '.version = $v | .packages[0].identifier = $id' server.json > server.tmp
          mv server.tmp server.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/datlabhq/datlab-mcp:${{ steps.version.outputs.version }}
            ghcr.io/datlabhq/datlab-mcp:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.modelcontextprotocol.server.name=io.github.datlabhq/datlab-mcp

      - name: Confirm image label
        run: |
          set -euo pipefail
          docker pull "${IMAGE}:${{ steps.version.outputs.version }}"
          label="$(docker inspect --format='{{index .Config.Labels "io.modelcontextprotocol.server.name"}}' "${IMAGE}:${{ steps.version.outputs.version }}")"
          test "$label" = "io.github.datlabhq/datlab-mcp"

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The official MCP Registry only accepts anonymously pullable images.
          # The package record can lag a few seconds behind the push.
          for i in 1 2 3 4 5 6; do
            if gh api --method PATCH "orgs/datlabhq/packages/container/datlab-mcp" -f visibility=public; then
              echo "GHCR package visibility set to public."
              exit 0
            fi
            sleep 5
          done
          echo "Could not set ghcr.io/datlabhq/datlab-mcp to public with GITHUB_TOKEN."
          echo "An org owner needs to open https://github.com/orgs/datlabhq/packages?repo_name=datlab-mcp"
          echo "then Package settings -> Change visibility -> Public, and re-run this workflow."
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
